spring:
  application:
    name: baedal-support-agent

  # -------------------------------------------------------------------
  # Round 6 — Graceful Shutdown phase timeout (server.shutdown: graceful 와 한 세트)
  #   SIGTERM 수신 → 새 요청 거부(503) → 진행 중 요청을 최대 30초까지 완료 대기 → 종료.
  #   LLM 왕복이 10초+ 걸릴 수 있어, 즉시 종료하면 고객 답변이 중간에 잘린다.
  # -------------------------------------------------------------------
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # -------------------------------------------------------------------
  # Round 4 — PgVector 연결 (docker-compose.yml 참조)
  #   db: baedal / user: baedal / password: baedal / port: 5432
  # -------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/baedal
    username: baedal
    password: baedal
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5
        options:
          temperature: 0.3
      # Round 4 — 임베딩 모델을 Ollama로 통일한다.
      # 사용 전: ollama pull qwen3-embedding:0.6b
      embedding:
        model: qwen3-embedding:0.6b

    # -------------------------------------------------------------------
    # Round 4 — PgVector 설정
    #   initialize-schema=true 이면 Spring AI가 앱 기동 시 자동으로
    #   vector_store 테이블과 확장(vector, uuid-ossp, hstore)을 생성한다.
    #   dimensions는 임베딩 모델 차원과 반드시 일치해야 한다:
    #     - qwen3-embedding:0.6b → 1024
    #     - nomic-embed-text → 768
    # -------------------------------------------------------------------
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        # 스키마/테이블명 기본값 사용 (public.vector_store)

# -------------------------------------------------------------------
# Round 6 — Graceful Shutdown (server)
#   배포/재시작 시 SIGTERM을 받으면 진행 중 요청을 안전하게 끝낸다.
# -------------------------------------------------------------------
server:
  shutdown: graceful

# -------------------------------------------------------------------
# Round 6 — Observability (Spring Boot Actuator + Micrometer)
#   /actuator/health      : ollama 커스텀 인디케이터 포함 종합 상태
#   /actuator/metrics     : baedal.agent.* 커스텀 지표
#   /actuator/prometheus  : Prometheus 스크래핑 포맷
# -------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # 운영에 필요한 것만 노출(나머지 actuator 엔드포인트는 닫아둔다).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always       # /actuator/health에 ollama 등 컴포넌트별 상태까지 노출
      show-components: always
      probes:
        enabled: true            # liveness/readiness 프로브 활성(로컬에서도)
      group:
        # Ollama가 죽으면 readiness=DOWN → (k8s/LB가) 트래픽을 끊어 장애 전파를 차단한다.
        readiness:
          include: readinessState,ollama
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.ai.ollama: TRACE
    org.springframework.ai.model.tool: TRACE
    org.springframework.web.client: DEBUG
    com.baedal.support: DEBUG
