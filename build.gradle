plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.baedal'
version = '0.0.1'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories { mavenCentral() }

ext { set('springAiVersion', '1.0.0') }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

    // Round 4 — RAG (PgVector)
    //   1) PgVector VectorStore 자동 구성 (Spring AI 1.0)
    //   2) QuestionAnswerAdvisor 등 벡터 기반 Advisor
    //   3) PostgreSQL 드라이버 (PgVector는 PostgreSQL 기반)
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
    runtimeOnly    'org.postgresql:postgresql'

    // Round 6 — Observability & 운영
    //   actuator   : /actuator/health, /actuator/metrics, /actuator/prometheus 엔드포인트 제공
    //   micrometer-registry-prometheus : 커스텀 메트릭(baedal.agent.*)을 Prometheus 포맷으로 노출
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Round 3 — 3단계(JDBC 저장소 실험) 시 아래 두 줄의 주석을 해제한다.
    // 기본(InMemory) 상태에서 h2가 클래스패스에 있으면 DataSource가 자동 구성되어
    // JdbcChatMemoryRepository가 InMemory Bean과 충돌하므로, 평소엔 주석으로 둔다.
    // implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
    // runtimeOnly    'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

// Round 5 — Guardrail 순수 로직(마스커/디텍터/입력검사)에 JUnit 5 단위 테스트를 추가.
// (round1~4는 테스트가 없어 불필요했으나, JUnit Jupiter 테스트 인식을 위해 명시한다.)
tasks.named('test') {
    useJUnitPlatform()
}
